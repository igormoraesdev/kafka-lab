server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5440/customer
    username: customer
    password: customer

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.jdbc.time_zone: UTC

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    org.springframework: INFO
    org.springframework.kafka: INFO
  file:
    name: logs/spring-boot-app.log
