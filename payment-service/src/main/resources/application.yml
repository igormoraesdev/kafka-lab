server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5440/payment
    username: payment
    password: payment

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    org.springframework: INFO
    org.springframework.kafka: INFO
  file:
    name: logs/spring-boot-app.log
